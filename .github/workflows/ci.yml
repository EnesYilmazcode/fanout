name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck plus the smoke suite (auth, sealing, routing, streaming,
      # abuse limits, and the full supporter-relay round-trip). Gates every
      # push to main, which is what Vercel deploys to production.
      - run: npm run check

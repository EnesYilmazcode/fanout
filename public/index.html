<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- This page keeps a bearer key in localStorage, so any XSS is a key-theft
     primitive. The CSP is deliberately strict: no inline script or style, no
     third-party anything, network calls to this origin only. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
<title>Fanout</title>
<meta name="description" content="One API key. Answers come from supporters running Claude Code." />
<link rel="stylesheet" href="/app.css" />
</head>
<body>

<button id="mode-switch">Become a supporter</button>

<main>
  <h1>Fanout</h1>

  <section id="view-use">
    <div class="keyrow">
      <button id="btn-regen" class="icon" title="Regenerate key" aria-label="Regenerate key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16h-5v5"/></svg>
      </button>
      <code id="key">&nbsp;</code>
      <button id="btn-copy" class="icon" title="Copy key" aria-label="Copy key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <p class="hint"><code id="base-url"></code> · model <code>claude-code</code></p>
  </section>

  <section id="view-support" hidden>
    <p class="lead">Paste this into Claude Code:</p>
    <pre id="worker"></pre>
    <button id="btn-copy-worker">Copy</button>
    <p class="hint">While it runs, your machine answers other people's requests — you'll see
    their prompts, they'll get your answers.</p>
  </section>

  <footer>
    <a href="https://github.com/EnesYilmazcode/fanout#readme">docs</a>
    <a href="/demo.html">bring your own keys</a>
  </footer>
</main>

<script src="/app.js"></script>
</body>
</html>
